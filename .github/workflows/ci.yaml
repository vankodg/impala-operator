name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Verify generated files are up to date
        run: |
          make manifests generate
          git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
      # With Docker's containerd image store, a pulled multi-arch image lacks the
      # other platforms' blobs and `kind load` fails ("ctr: content digest ...
      # not found"). Switch to the classic store.
      - name: Use the classic Docker image store
        run: |
          cfg=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          echo "${cfg:-{\}}" | jq '.features["containerd-snapshotter"] = false' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          test "$(docker info -f '{{.Driver}}')" = overlay2
      - run: make test-e2e
