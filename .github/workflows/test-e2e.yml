name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # With Docker's containerd image store, a pulled multi-arch image lacks the
      # other platforms' blobs and `kind load` fails ("ctr: content digest ...
      # not found"). Switch to the classic store.
      - name: Use the classic Docker image store
        run: |
          cfg=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          echo "${cfg:-{\}}" | jq '.features["containerd-snapshotter"] = false' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          test "$(docker info -f '{{.Driver}}')" = overlay2

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
